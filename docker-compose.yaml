services:
  local-conviction-bot:
    image: local-llm-conviction-bot
    container_name: local-llm-conviction-bot
    volumes:
      - ~/playground_keys:/app/keys       # Read and write to keys directory. Let's see if this fixes anything
      - ./app/app:/app/app
    tty: true
    environment:
      - KEYS_DIR=/app/keys

  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      - POSTGRES_USER=youruser
      - POSTGRES_PASSWORD=yourpassword
      - POSTGRES_DB=newsdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
